<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Clarity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="nav scrolled">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Clarity</span>
      </a>
    </div>
  </nav>

  <div class="hero-bg" style="position:fixed;inset:0;pointer-events:none;z-index:0;">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <main class="auth-page">
    <div class="auth-card" style="position:relative;z-index:1;">
      <div class="auth-logo">
        <a href="index.html" class="logo">
          <span class="logo-icon">◈</span>
          <span class="logo-text">Clarity</span>
        </a>
      </div>
      <h2>Bienvenido/a</h2>
      <p class="auth-sub">Accedé a tu espacio de transformación.</p>

      <div class="msg msg-error" id="errorMsg"></div>
      <div class="msg msg-success" id="successMsg"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tu@email.com" />
        <span class="field-error" id="emailError">Ingresá un email válido.</span>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña" />
        <span class="field-error" id="passwordError">Ingresá tu contraseña.</span>
      </div>

      <button class="btn-primary btn-block" id="loginBtn" type="button">
        <span id="loginBtnText">Ingresar</span>
      </button>

      <p class="auth-footer">¿No tenés cuenta? <a href="register.html">Registrate gratis</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Redirect if already logged in
    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = 'dashboard.html';
    });

    function showError(id, show) {
      document.getElementById(id).classList.toggle('show', show);
    }
    function showMsg(id, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.classList.add('show');
    }
    function hideMsg(id) {
      document.getElementById(id).classList.remove('show');
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
      hideMsg('errorMsg'); hideMsg('successMsg');
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      let valid = true;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('emailError', true); valid = false; }
      else showError('emailError', false);
      if (!password) { showError('passwordError', true); valid = false; }
      else showError('passwordError', false);
      if (!valid) return;

      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      document.getElementById('loginBtnText').textContent = 'Ingresando…';

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        showMsg('errorMsg', 'Email o contraseña incorrectos.');
        btn.disabled = false;
        document.getElementById('loginBtnText').textContent = 'Ingresar';
      } else {
        showMsg('successMsg', '¡Bienvenido/a! Redirigiendo…');
        setTimeout(() => window.location.href = 'dashboard.html', 800);
      }
    });

    // Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
  </script>
</body>
</html>
